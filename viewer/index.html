<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mascot 3D viewer</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ec; color: #3b332c; }
  header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  select, label { font-size: 14px; }
  model-viewer { width: 100vw; height: calc(100vh - 56px); --poster-color: transparent; }
</style>
</head>
<body>
<header>
  <strong>Mascot 3D</strong>
  <select id="pick"></select>
  <label><input type="checkbox" id="spin" checked> auto-rotate</label>
</header>
<model-viewer id="mv" camera-controls auto-rotate shadow-intensity="0.8" exposure="1.0"
  environment-image="neutral" tone-mapping="neutral"></model-viewer>
<script>
  // Lists every .glb in ../outputs (served by `python -m http.server` from the project root).
  const mv = document.getElementById('mv'), pick = document.getElementById('pick');
  fetch('../outputs/').then(r => r.text()).then(html => {
    const files = [...html.matchAll(/href="([^"]+\.glb)"/g)].map(m => decodeURIComponent(m[1]));
    for (const f of files) pick.add(new Option(f, '../outputs/' + f));
    if (files.length) mv.src = pick.value;
  });
  pick.onchange = () => mv.src = pick.value;
  document.getElementById('spin').onchange = e => mv.autoRotate = e.target.checked;
</script>
</body>
</html>
